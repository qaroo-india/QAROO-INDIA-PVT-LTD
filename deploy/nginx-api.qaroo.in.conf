# Nginx reverse proxy for the Qaroo India API on EC2.
#
#   sudo cp deploy/nginx-api.qaroo.in.conf /etc/nginx/sites-available/api.qaroo.in
#   sudo ln -s /etc/nginx/sites-available/api.qaroo.in /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t          # ALWAYS test before reloading
#   sudo systemctl reload nginx
#
# Then issue the certificate, which rewrites this file to add the TLS block and
# installs a renewal timer:
#
#   sudo certbot --nginx -d api.qaroo.in
#   sudo certbot renew --dry-run
#
# The backend must be started with HOST=127.0.0.1 so port 5000 is reachable only
# from this proxy. Keep port 5000 closed in the EC2 security group regardless -
# the bind address and the firewall are two independent controls and you want
# both.

server {
    listen 80;
    listen [::]:80;
    server_name api.qaroo.in;

    # Certbot needs this to stay on plain HTTP to answer the challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # certbot --nginx replaces this block with listen 443 ssl and the cert
    # paths. If you are terminating TLS elsewhere, keep 80 and drop the redirect
    # above.
    listen 80;
    server_name api.qaroo.in;

    # Do not advertise the nginx version in error pages or the Server header.
    server_tokens off;

    # The JSON body limit in the app is 15mb (resumes arrive base64-encoded);
    # nginx must not reject the request before Express can apply its own limit
    # and return a proper message.
    client_max_body_size 16m;

    # Slow-request protection: a client that opens a connection and dribbles
    # bytes ties up a worker otherwise.
    client_body_timeout 30s;
    client_header_timeout 30s;

    access_log /var/log/nginx/api.qaroo.in.access.log;
    error_log  /var/log/nginx/api.qaroo.in.error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # The app sets `trust proxy 1`, meaning it trusts exactly one hop and
        # reads the LAST entry of X-Forwarded-For as the client. These headers
        # are therefore set, not appended: using $proxy_add_x_forwarded_for here
        # would preserve a client-supplied X-Forwarded-For, letting a caller
        # spoof its own address and walk straight through the rate limiters.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;

        # Cookies are HttpOnly and Secure in production; nothing here should
        # cache an authenticated response.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection '';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Health check, handy for an ALB or an uptime monitor.
    location = /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        access_log off;
    }
}
